name: Go

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      HOST: localhost
      DBPORT: 5432
      USER: root
      PASSWORD: root
      DBNAME: root
      SSLMODE: disable
    strategy:
      matrix:
        go_version: ['1.18', '1.17', '>=1.18']
        os: ['ubuntu-latest', 'ubuntu-22.04']
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: ${{ matrix.go_version }}
      
    - name: Build-DB
      run: docker compose build
      
    - name: Create-DB
      run: docker compose up -d

    # Pausa burocrática de 5 segundos para o banco de dados ligar de verdade
    # Evita que o "go test" tente conectar com o banco ainda inicializando internamente
    - name: Wait for Database
      run: sleep 5

    - name: Test
      run: go test -v main_test.go 
      
  
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go for Build
      uses: actions/setup-go@v4
      with:
        go-version: '1.18' # O job de build precisa saber qual Go usar, já que ele roda isolado do anterior

    - name: Build
      run: go build -v main.go
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
    # Artifact name. If the `archive` input is `false`, the name of the file uploaded will be the artifact name.
        name: programa
        # A file, directory or wildcard pattern that describes what to upload.
        path: main
        # The desired behavior if no files are found using the provided path.

  docker:
    needs: build
    uses: ./.github/workflows/Docker.yml
    secrets: inherit
  
  # Deploy_EC2:
  #   needs: build
  #   uses: ./.github/workflows/EC2.yml
  #   secrets: inherit

  # Deploy_ECS:
  #   needs: docker
  #   uses: ./.github/workflows/ECS.yml
  #   secrets: inherit
  
  # LoadTest:
  #   needs: docker
  #   if: ${{ github.ref_name == 'Homolog' }}
  #   uses: ./.github/workflows/LoadTest.yml
  #   secrets: inherit

  Deploy_EKS:
    needs: docker
    uses: ./.github/workflows/EKS.yml
    secrets: inherit